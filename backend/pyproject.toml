[project]
name = "booking"
version = "0.1.0"
description = "Booking bot, Mini App API and admin backend for a barbershop"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.*",
    "alembic==1.20.*",
    "argon2-cffi==25.1.*",
    "asyncpg==0.32.*",
    "fastapi==0.149.*",
    "pydantic-settings==2.16.*",
    "pyjwt==2.15.*",
    "pyyaml>=6.0",
    "redis==8.1.*",
    "sqlalchemy[asyncio]==2.1.*",
    "stripe==16.*",
    "tzdata>=2026.1",
    "uvicorn[standard]==0.54.*",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.*",
    "mypy==2.4.*",
    "pytest>=9",
    "pytest-asyncio==1.4.*",
    "ruff==0.17.*",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
booking-api = "booking.api.__main__:main"
booking-bot = "booking.bot.__main__:main"
booking-worker = "booking.worker.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "N", "C4", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["stripe.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
